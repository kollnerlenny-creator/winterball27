<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1020"/>
      <stop offset="50%" stop-color="#101a33"/>
      <stop offset="100%" stop-color="#070b16"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe8a3"/>
      <stop offset="50%" stop-color="#ffd27f"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="iceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#c5d8ff"/>
      <stop offset="100%" stop-color="#8fb4ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="rgba(143,180,255,0.22)" stroke-width="3"/>
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="rgba(255,210,127,0.18)" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Center Glow Orb -->
  <circle cx="256" cy="230" r="140" fill="radial-gradient(circle, rgba(143,180,255,0.18) 0%, transparent 70%)" opacity="0.6"/>

  <!-- Crown / Diadem above snowflake -->
  <g transform="translate(256, 116) scale(0.9)" filter="url(#glow)">
    <path d="M-60 20 L-45 -18 L-20 6 L0 -28 L20 6 L45 -18 L60 20 Z" fill="url(#goldGrad)" opacity="0.95"/>
    <circle cx="0" cy="-34" r="5" fill="#fff"/>
    <circle cx="-45" cy="-24" r="4.5" fill="#fff"/>
    <circle cx="45" cy="-24" r="4.5" fill="#fff"/>
  </g>

  <!-- Winterball Snowflake -->
  <g transform="translate(256, 240)" stroke="url(#iceGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- 6 Primary Axes -->
    <line x1="0" y1="-85" x2="0" y2="85" />
    <line x1="-73.6" y1="-42.5" x2="73.6" y2="42.5" />
    <line x1="-73.6" y1="42.5" x2="73.6" y2="-42.5" />

    <!-- Top Branch -->
    <path d="M-20 -55 L0 -72 L20 -55" fill="none" stroke-width="5" />
    <path d="M-14 -32 L0 -45 L14 -32" fill="none" stroke-width="5" />
    
    <!-- Bottom Branch -->
    <path d="M-20 55 L0 72 L20 55" fill="none" stroke-width="5" />
    <path d="M-14 32 L0 45 L14 32" fill="none" stroke-width="5" />

    <!-- Top-Right Branch -->
    <path d="M40 -40 L62 -36 L48 -18" fill="none" stroke-width="5" />
    <path d="M22 -22 L36 -20 L28 -8" fill="none" stroke-width="5" />

    <!-- Bottom-Left Branch -->
    <path d="M-40 40 L-62 36 L-48 18" fill="none" stroke-width="5" />
    <path d="M-22 22 L-36 20 L-28 8" fill="none" stroke-width="5" />

    <!-- Top-Left Branch -->
    <path d="M-40 -40 L-62 -36 L-48 -18" fill="none" stroke-width="5" />
    <path d="M-22 -22 L-36 -20 L-28 -8" fill="none" stroke-width="5" />

    <!-- Bottom-Right Branch -->
    <path d="M40 40 L62 36 L48 18" fill="none" stroke-width="5" />
    <path d="M22 22 L36 20 L28 8" fill="none" stroke-width="5" />

    <!-- Center Gem Ring -->
    <circle cx="0" cy="0" r="16" fill="#0b1220" stroke="url(#goldGrad)" stroke-width="4.5" />
    <circle cx="0" cy="0" r="6" fill="#fff" />
  </g>

  <!-- Typography -->
  <text x="256" y="380" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="9" text-anchor="middle">
    WINTERBALL
  </text>
  <g transform="translate(256, 420)">
    <rect x="-76" y="-18" width="152" height="34" rx="17" fill="rgba(143,180,255,0.18)" stroke="rgba(143,180,255,0.4)" stroke-width="1.5"/>
    <text x="0" y="5" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#ffd27f" letter-spacing="4" text-anchor="middle">
      ADMIN
    </text>
  </g>
</svg>
